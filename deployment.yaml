apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay-deployment
  labels:
    app: finsecure-pay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finsecure-pay
  template:
    metadata:
      labels:
        app: finsecure-pay
    spec:
      containers:
      - name: finsecure-pay
        image: kiruba11111985/finsecure-pay:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: finsecure-pay-config
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
